name: Run Decoder

on:
  push:
    branches: [main, test/node_labeling_on_amazon]
  pull_request:
    branches: [main, test/node_labeling_on_amazon]
  workflow_dispatch:

jobs:
  run-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 50000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch Amazon dataset from GitHub Release
        run: |
          echo "Downloading Amazon dataset from GitHub Releases..."
          wget -O amazon0302.pkl https://github.com/Samrawitgebremaryam/neural-subgraph-matcher-miner/releases/download/v1.0/amazon0302.pkl

          echo "Verifying downloaded file..."
          file amazon0302.pkl

          FILE_SIZE=$(stat -c%s amazon0302.pkl)
          echo "File size: $FILE_SIZE bytes"

          if [ $FILE_SIZE -lt 100000 ]; then
            echo "ERROR: Amazon dataset is too small. Likely not downloaded correctly."
            exit 1
          fi

          if file amazon0302.pkl | grep -Eq "HTML|ASCII|Unicode"; then
            echo "ERROR: Amazon dataset is not a valid binary file."
            exit 1
          fi

          echo "Amazon dataset verified as binary."

      - name: Pull prebuilt Docker image
        run: |
          echo "Logging into Docker Hub..."
          docker login -u samribahta -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          echo "Pulling latest decoder image..."
          docker pull samribahta/decoder-image:latest

      - name: Create output directories
        run: |
          mkdir -p ${{ github.workspace }}/plots/cluster
          mkdir -p ${{ github.workspace }}/results
          mkdir -p ${{ github.workspace }}/artifacts/label_encoder_cache_minilm_universal
          chmod -R 777 ${{ github.workspace }}/plots
          chmod -R 777 ${{ github.workspace }}/results
          chmod -R 777 ${{ github.workspace }}/artifacts

      - name: Verify semantic checkpoint files
        run: |
          test -f ${{ github.workspace }}/ckpt/universal/model_universal_hybrid_minilm_rgcn.pt
          test -f ${{ github.workspace }}/ckpt/universal/model_universal_hybrid_minilm_rgcn.pt.meta.json

      - name: Check available processors and usage percentage
        id: cpu-check
        run: |
          TOTAL_CPUS=$(nproc)
          USED_CPUS=4
          PERCENT_USED=$(( 100 * USED_CPUS / TOTAL_CPUS ))
          echo "Total available processors: $TOTAL_CPUS"
          echo "Processors used for decoder: $USED_CPUS"
          echo "Percent of processors used: ${PERCENT_USED}%"
          echo "total_cpus=$TOTAL_CPUS" >> $GITHUB_OUTPUT
          echo "percent_used=$PERCENT_USED" >> $GITHUB_OUTPUT

      - name: Run semantic decoder in Docker container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e PYTHONUNBUFFERED=1 \
            samribahta/decoder-image:latest \
            bash -c "
              set -euo pipefail
              echo 'Preparing semantic label cache for Amazon dataset...'
              python scripts/precompute_label_cache.py \
                --graph_pkl=amazon0302.pkl \
                --cache_dir=/app/artifacts/label_encoder_cache_minilm_universal \
                --backend=hashing \
                --batch_size=256

              echo 'Starting semantic decoder run on Amazon dataset...'
              python -m subgraph_mining.decoder \
                --dataset=amazon0302.pkl \
                --model_path=ckpt/universal/model_universal_hybrid_minilm_rgcn.pt \
                --vocab_dir=/app/artifacts/vocab_amazon_universal_semantic_ci \
                --n_neighborhoods=10000 \
                --n_trials=1000 \
                --min_pattern_size=3 \
                --max_pattern_size=8 \
                --search_strategy=greedy \
                --min_neighborhood_size=20 \
                --max_neighborhood_size=29 \
                --node_anchored \
                --out_path=/app/results/amazon_semantic_patterns.pkl \
                --graph_type=directed \
                --visualize_instances \
                2>&1 | tee /app/amazon_semantic_decoder.log

              echo 'Semantic decoder finished successfully.'
              echo 'Checking output directories...'
              test -f /app/results/amazon_semantic_patterns.pkl
              test -f /app/results/amazon_semantic_patterns.json
              ls -la /app/plots/cluster || echo 'No cluster plots found.'
              ls -la /app/results
            "

      - name: Check for generated files
        run: |
          echo "Checking plots directory:"
          ls -R plots/ || echo "No plots directory found"
          echo "Checking results directory:"
          ls -R results/ || echo "No results directory found"

      - name: Upload plots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-decoder-results
          path: |
            plots/
            results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-decoder-logs
          path: |
            *.log
            *.err
          retention-days: 7
          if-no-files-found: ignore
